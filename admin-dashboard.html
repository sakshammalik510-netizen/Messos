<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MessOS - Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
   <link rel="icon" href="logo.png">
</head>
<body>
  <div id="topbar"></div>

  <main>
    <h1>Admin dashboard</h1>
    <p class="sub">Today's head-count forecast (opted in) next to the actual meals served.</p>

    <!-- 4 summary boxes, filled by JavaScript below -->
    <div class="stats">
      <div class="card stat"><div class="num" id="statStudents">0</div><div class="label">students registered</div></div>
      <div class="card stat"><div class="num" id="statMeals">0</div><div class="label">meals scheduled today</div></div>
      <div class="card stat"><div class="num" id="statForecast">0</div><div class="label">total opted in today</div></div>
      <div class="card stat"><div class="num" id="statServed">0</div><div class="label">total served today</div></div>
    </div>

    <div class="card">
      <h2>Today's meals</h2>
      <table>
        <thead>
          <tr><th>Meal</th><th>Menu</th><th>Cut-off</th><th>Status</th><th>Forecast</th><th>Served</th><th>Progress</th></tr>
        </thead>
        <tbody id="mealRows"></tbody>
      </table>
    </div>
  </main>

  <script src="admin.js"></script>
  <script>
    renderNav("dashboard");

    function loadDashboard() {
      // Step 1: read everything we need from storage
      const users  = DB.get(KEYS.users, []);
      const slots  = DB.get(KEYS.slots, []);
      const optins = DB.get(KEYS.optins, []);
      const ledger = DB.get(KEYS.ledger, []);

      // Step 2: keep only today's meals
      const todaySlots = slots.filter(s => s.date === todayStr());

      // Step 3: for each meal, count forecast and served
      let totalForecast = 0, totalServed = 0;
      let html = "";

      todaySlots.forEach(slot => {
        const forecast = optins.filter(o => o.slotId === slot.id && o.optedIn).length;
        const served = ledger.filter(l => l.slotId === slot.id && l.result === "accepted").length;
        const pct = forecast === 0 ? 0 : Math.min(100, Math.round((served / forecast) * 100));
        const status = slotStatus(slot);

        totalForecast += forecast;
        totalServed += served;

        html += `<tr>
          <td><b>${esc(slot.mealType)}</b></td>
          <td>${esc(slot.items)}</td>
          <td>${fmtTime(slot.cutoffTime)}</td>
          <td><span class="badge ${status}">${status}</span></td>
          <td>${forecast}</td>
          <td>${served}</td>
          <td><div class="bar"><span style="width:${pct}%"></span></div></td>
        </tr>`;
      });

      document.getElementById("mealRows").innerHTML =
        html || `<tr><td colspan="7" class="empty">No meals scheduled for today. Add one in "Menu & cut-off".</td></tr>`;

      // Step 4: fill the summary boxes
      document.getElementById("statStudents").textContent = users.filter(u => u.role === "student").length;
      document.getElementById("statMeals").textContent = todaySlots.length;
      document.getElementById("statForecast").textContent = totalForecast;
      document.getElementById("statServed").textContent = totalServed;
    }

    loadDashboard();
    setInterval(loadDashboard, 30000); // refresh every 30 seconds so statuses update by themselves
  </script>
</body>
</html>
