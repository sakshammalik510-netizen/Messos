<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessOS - Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>

<body>
    <div class="container">

        <div class="form-box login" id="loginform">
            <form id="login-form">
                <img src="logo.png" alt="Site logo" class="site-logo">
                <h1>Login</h1>
                <div class="input-box">
                    <label for="email">E-mail Id:</label>
                    <input type="email" id="email" name="email" placeholder="college e-mail id" autocomplete="username" required>
                </div>
                <div class="input-box">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn" id="submit-btn">Login</button>
                <p class="msg" id="msg"></p>
            </form>
        </div>
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Welcome Back!</h1>
                <p>Students, mess staff and admins all log in here.</p>
                <p>Don't have an account?</p>
                <a href="studentregister.html" class="btn register-btn">Register Now</a>
            </div>
        </div>

    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
